<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MovieLens Recommender</title>
  <link rel="icon" type="image/svg+xml" href="/assets/logo.svg">
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body class="app-body">
  <header class="topbar">
    <a href="/" class="brand" style="text-decoration:none; color:inherit;">
      <img src="/assets/logo.svg" alt="Logo" class="brand-logo">
      <div>
        <p class="eyebrow">Sistema de recomendacion</p>
        <h1>Recomendaciones</h1>
      </div>
    </a>
    <form class="navbar-search" id="navbar-search-form" action="/search.html">
      <input
        class="search-input"
        type="search"
        name="q"
        placeholder="Buscar pelicula por titulo o genero..."
        aria-label="Buscar pelicula"
      >
      <button class="button" type="submit">Buscar</button>
    </form>
    <nav class="nav-links">
      <a href="/profile.html" class="button ghost">Perfil</a>
      <button id="refresh-recommendations" class="button secondary" type="button">Actualizar recomendaciones</button>
      <button id="logout-button" class="button" type="button">Cerrar sesion</button>
    </nav>
  </header>

  <main class="app-shell">
    <section class="hero-band">
      <div class="hero-copy">
        <h2 id="welcome-title">Cargando perfil...</h2>
        <p id="hero-subtitle">
          Busca peliculas, calificalas y deja que el recomendador se ajuste a tus gustos.
        </p>
      </div>
    </section>

    <section class="content-band alt-band">
      <div class="section-head">
        <div>
          <p class="eyebrow">Para ti</p>
          <h3>Peliculas recomendadas</h3>
        </div>
        <p id="strategy-pill" class="strategy-pill">Cargando recomendaciones...</p>
      </div>
      <div class="grid movies-grid" id="recommendations-grid"></div>
    </section>
  </main>

  <div id="toast" class="toast" aria-live="polite"></div>

  <script type="module" src="/js/recommendations.js"></script>
</body>
</html>
