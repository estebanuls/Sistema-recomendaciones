version: "3.9"

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "${APP_PORT:-8000}:8000"
    environment:
      APP_ENV: ${APP_ENV:-development}
      APP_HOST: 0.0.0.0
      APP_PORT: 8000
      APP_SECRET_KEY: ${APP_SECRET_KEY:-change-me}
      TOKEN_TTL_MINUTES: ${TOKEN_TTL_MINUTES:-1440}
      BCRYPT_ROUNDS: ${BCRYPT_ROUNDS:-12}
      LOGIN_BLOCK_MINUTES: ${LOGIN_BLOCK_MINUTES:-15}
      MAX_LOGIN_ATTEMPTS: ${MAX_LOGIN_ATTEMPTS:-3}
      MIN_COLD_START_INTERACTIONS: ${MIN_COLD_START_INTERACTIONS:-5}
      DEFAULT_RECOMMENDATION_COUNT: ${DEFAULT_RECOMMENDATION_COUNT:-10}
      AUTO_RETRAIN_ON_STARTUP: ${AUTO_RETRAIN_ON_STARTUP:-true}
      AUTO_RETRAIN_INTERVAL_SECONDS: ${AUTO_RETRAIN_INTERVAL_SECONDS:-300}
      LATENT_FACTORS: ${LATENT_FACTORS:-32}
